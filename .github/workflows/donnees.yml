# Mosquées de Tunisie (OpenStreetMap + Wikidata + Wikipédia + Wikimedia Commons) : relues TOUS LES 3 MOIS (règle d'Ahmed :
# les lieux changent peu). Puis les pages sont refaites (tools/construire.py) et testées avant d'être publiées.
# Panne ou réponse suspecte : l'ancien fichier est gardé et une alerte est ouverte (issue « alerte-robot » → e-mail à Ahmed).
# Battement de cœur : un commit (vide si rien n'a changé) pour que GitHub ne mette pas les robots en pause.
name: Relevé des mosquées
on:
  schedule:
    - cron: "37 3 1 1,4,7,10 *"   # 1er janvier, avril, juillet et octobre (heure UTC ; TZ Africa/Tunis pour les dates)
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: robot
  cancel-in-progress: false
env:
  TZ: Africa/Tunis
  PYTHONIOENCODING: utf-8
jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save --no-package-lock jsdom
      - name: Relever OpenStreetMap et Wikidata
        id: releve
        run: |
          set +e
          python tools/mosquees_donnees.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Refaire les pages, tester, enregistrer
        run: |
          python tools/construire.py
          python tools/test_lieux.py
          node tools/test_site.mjs
          git config user.name "robot-mosquees"
          git config user.email "robot-mosquees@users.noreply.github.com"
          git add donnees mosquee grandes-mosquees a-propos sitemap.xml index.html assets/trad assets/l ar en tr id ur de es it pt nl zh ja ko hi ru vi th tl sv ro   # + une adresse par langue (tools/pages_langues.py)
          if git diff --cached --quiet; then
            git commit --allow-empty -m "Battement de coeur : relevé des mosquées inchangé"
          else
            git commit -m "Relevé des mosquées du $(date +%d/%m/%Y)"
          fi
          git pull -q --rebase --autostash
          git push
      - name: Alerte refermée si tout va bien
        if: success() && steps.releve.outputs.code == '0'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for n in $(gh issue list --label alerte-robot --state open --search "Mosquées : relevé trimestriel en échec in:title" --json number -q '.[].number'); do gh issue close "$n" --comment "Réparé : le robot a de nouveau réussi le $(date +%d/%m/%Y)."; done
      - name: Alerte
        if: steps.releve.outputs.code != '0' || failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh label create alerte-robot --color B60205 --force >/dev/null 2>&1 || true
          titre="Mosquées : relevé trimestriel en échec"
          corps="Le relevé (OpenStreetMap / Wikidata) n'a pas abouti ou un test a échoué. Les anciennes données sont gardées. Journal : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          n=$(gh issue list --label alerte-robot --state open --search "$titre in:title" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "Toujours vrai le $(date +%d/%m/%Y). $corps"; else gh issue create --title "$titre" --body "$corps" --label alerte-robot; fi
